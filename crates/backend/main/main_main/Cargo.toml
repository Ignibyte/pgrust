[package]
name = "main_main"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "main_main"
path = "src/lib.rs"

[[bin]]
name = "postgres"
path = "src/bin/postgres.rs"
# The binary's global allocator is mimalloc, and the hooks it installs read it.
required-features = ["mimalloc"]

[[bin]]
name = "pgrust-init"
path = "src/bin/pgrust_init.rs"
required-features = ["init"]

[features]
default = ["mimalloc", "re2"]
# mimalloc, the `postgres` binary's global allocator (a C build). The library
# never uses it: a binary that embeds pgrust through `run_server` chooses its
# own allocator, sets `default-features = false`, and compiles none of it.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# `main_main::embedded` and `pgrust-init`: a data directory and a share
# directory without PostgreSQL installed, unpacked from the pristine cluster and
# share directory embedded from `pristine/` (scripts/rustal-pristine.sh writes
# them). About 5 MB of archive in the binary, and pure Rust: off by default.
init = ["dep:flate2", "dep:sha2", "dep:tar"]
# The RE2 regex engine (regexp_alt's `re2`). pgrust's own `postgres` binary
# keeps it; an embedding binary that cannot require libre2 on its hosts sets
# `default-features = false` and gets the Spencer-only engine in every profile.
re2 = ["regexp_alt/re2"]
# Antithesis harness builds only (antithesis/ directory): SDK assertions +
# sancov coverage instrumentation. OFF by default — product builds compile
# none of it. The harness image build (root Dockerfile, ARG ANTITHESIS=1)
# enables it together with the coverage rustflags; the crate and the flags
# are a single unit (either alone produces an invalid binary).
antithesis = [
    "dep:antithesis_sdk",
    "dep:antithesis-instrumentation",
    # Steering assertions in the SUT (already in the dependency graph
    # transitively; the direct optional rows below exist only to flip their
    # features from here): FPI restore during redo, ParkLot interrupt probe.
    "dep:pgsync",
    "pgsync/antithesis",
    "dep:xlogutils",
    "xlogutils/antithesis",
]

# Registers the C regression module's OAuth validators (`validator`,
# `fail_validator`, `oauth_test_validator`) and their oauth_validator.* GUCs.
# Test/CI builds only: these authorize any bearer token. Product builds
# (default features) compile none of it — see the oauth_validators crate
# header for why this is a feature and not a GUC.
oauth-test-validator = [
    "oauth_validators/test-validator",
    "guc_tables/oauth-test-validator",
]

[dependencies]
# The `init` feature: gzip (miniz_oxide, no C), tar, and the checksum check.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
regexp_alt = { path = "../../utils/adt/regexp_alt", default-features = false }
# Feature carriers for oauth-test-validator (both already in the graph
# transitively via seams_init / guc).
oauth_validators = { path = "../../libpq/oauth_validators" }
guc_tables = { path = "../../utils/misc/guc_tables" }
# Antithesis SDK (assertions/lifecycle); portable, but only compiled under
# the `antithesis` feature.
antithesis_sdk = { version = "0.2.9", optional = true }
# Antithesis-only install rows (see the `antithesis` feature): probe
# registration target + feature carriers for the SUT steering assertions.
pgsync = { path = "../../../_support/pgsync", optional = true }
xlogutils = { path = "../../access/transam/xlogutils", optional = true }
ipc = { path = "../../storage/ipc/ipc" }
libc = "0.2"
mcx = { path = "../../../_support/mcx" }
types_error = { path = "../../../_support/types/types_error" }
elog = { path = "../../utils/error/elog" }
guc = { path = "../../utils/misc/guc" }
init_small = { path = "../../utils/init/init_small" }
stack_depth = { path = "../../utils/misc/stack_depth" }
ps_status = { path = "../../utils/misc/ps_status" }
pg_locale = { path = "../../utils/adt/pg_locale" }
pg_path = { path = "../../../port/pg_path" }
postmaster = { path = "../../postmaster/postmaster" }
memwatchdog = { path = "../../postmaster/memwatchdog" }
# GL-CONCMEM-1: the POOL-QOS memory governor's fallback usage probe
# (install_qos_mem_probe) — install-only dep, mirroring memwatchdog's
# allocator-stats install above it in bin/postgres.rs.
runtime = { path = "../../executor/runtime" }
postgres_seams = { path = "../../tcop/postgres_seams" }
seams_init = { path = "../../../_support/seams_init" }

# mimalloc is a C allocator; wasm32 std already defaults to dlmalloc, and
# bin/postgres.rs cfg-outs the global-alloc + release hook there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", optional = true }
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }

# The Antithesis coverage runtime links only on the platform Antithesis runs
# (linux/amd64); target-scoping keeps macOS/aarch64 dev builds working even
# under --all-features.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
antithesis-instrumentation = { version = "0.1.0", optional = true }

# `pgrust_sim` (non-default cfg): P4 sim arms live behind it; empty/absent
# in product builds (law 0.1).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrust_sim)'] }
